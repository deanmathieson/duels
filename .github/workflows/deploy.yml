name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate static site
        run: npm run generate
        # NOTE: builds for a ROOT-served site (baseURL '/'), which is fully working.
        # Serve at a domain root: a user/org Pages site (<user>.github.io) or a
        # project repo with a custom domain (add a public/CNAME file).
        # A bare project sub-path (<user>.github.io/<repo>/) would need
        # NUXT_APP_BASE_URL: /<repo>/, but this Nuxt+Vite version has a SPA-generate
        # bug with a non-root baseURL — prefer root/custom-domain hosting.
      - name: SPA deep-link fallback
        run: cp .output/public/index.html .output/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
